name: Tag Release
description: >
  Creates an annotated git tag, updates CHANGELOG.md, RELEASE.md, CONTRIBUTORS.md,
  version files (package.json, pyproject.toml, etc.), and README version badge.
  Version bump is inferred from Conventional Commits or overridden via input.

author: jcsturges

branding:
  icon: tag
  color: blue

inputs:
  token:
    description: GitHub token with contents:write and pull-requests:read permissions
    required: true
  version-type:
    description: >
      Version bump type. "auto" infers from Conventional Commits.
      Same-day tags always produce a patch bump regardless of this setting.
    required: false
    default: auto
  default-branch:
    description: Default branch name used for initial commit link references
    required: false
    default: main
  dry-run:
    description: >
      When "true", calculates and logs the new version but does not create
      commits, tags, or GitHub Releases.
    required: false
    default: "false"

outputs:
  version:
    description: The newly created version tag (e.g. v1.2.3)
    value: ${{ steps.run.outputs.version }}
  previous-version:
    description: The previous version tag, or empty string if this is the first tag
    value: ${{ steps.run.outputs.previous-version }}

runs:
  using: composite
  steps:
    - name: Checkout with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ github.action_path }}/.nvmrc

    - name: Install action dependencies
      shell: bash
      run: npm install --omit=dev --prefix "$GITHUB_ACTION_PATH"
      working-directory: ${{ github.action_path }}

    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Run tag-release
      id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/index.js"
      env:
        INPUT_VERSION_TYPE: ${{ inputs.version-type }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.token }}
